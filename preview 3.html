
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual Circle AI Camera</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    padding: 2vw;
}

.lens {
    width: min(47vw, 48vh);
    height: min(47vw, 48vh);
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: black;
    position: relative;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

@media (orientation: landscape) {
    .lens {
        width: min(47vw, 88vh);
        height: min(47vw, 88vh);
    }
}

#placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: white;
    background: black;
    font: 16px system-ui;
    text-align: center;
    z-index: 5;
    cursor: pointer;
    padding: 25px;
}

#status {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font: 12px monospace;
    background: rgba(0,0,0,.7);
    padding: 8px 12px;
    border-radius: 5px;
    z-index: 10;
    pointer-events: none;
    text-align: center;
}

</style>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>

<!-- COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

</head>

<body>

<div id="stage">

    <div class="lens">
        <canvas id="left"></canvas>
    </div>

    <div class="lens">
        <canvas id="right"></canvas>
    </div>

    <div id="placeholder">
        Tap anywhere to start SCORCHBLADE
    </div>

</div>

<div id="status">AI not started</div>

<video id="camera" autoplay playsinline muted
       style="display:none"></video>

<script>

const camera = document.getElementById("camera");
const placeholder = document.getElementById("placeholder");
const statusText = document.getElementById("status");

const left = document.getElementById("left");
const right = document.getElementById("right");

const ctxLeft = left.getContext("2d", {
    willReadFrequently: true
});

const ctxRight = right.getContext("2d", {
    willReadFrequently: true
});

let stream = null;
let running = false;
let model = null;

let latestDetections = [];

let lastDetectionTime = 0;
const DETECTION_INTERVAL = 700;

// Brightness highlighting
const BRIGHTNESS_THRESHOLD = 245;
const MIN_SATURATION = 0.08;
const RED_STRENGTH = 1;

// AI settings
const CONFIDENCE_THRESHOLD = 0.55;

// Speech settings
let previousObjects = new Set();
let speechEnabled = true;
let lastSpeechTime = 0;
const SPEECH_COOLDOWN = 1200;


// ====================================
// START CAMERA
// ====================================

async function startCamera() {

    if (stream || running) return;

    placeholder.textContent = "Requesting camera access...";

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 3840
                },
                height: {
                    ideal: 2160
                },
                frameRate: {
                    ideal: 30
                }
            }
        });

        camera.srcObject = stream;

        await camera.play();

        left.width = right.width = 960;
        left.height = right.height = 960;

        running = true;

        placeholder.style.display = "none";

        statusText.textContent = "Loading COCO-SSD AI...";

        // Start image processing immediately.
        processFrame();

        // Load object detection model.
        await loadAI();

    } catch (error) {

        console.error(error);

        placeholder.style.display = "grid";

        placeholder.textContent =
            "Camera or AI failed to start. Check camera permissions and internet connection.";

        statusText.textContent = "Startup failed";

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        stream = null;
        running = false;

    }
}


// ====================================
// LOAD AI MODEL
// ====================================

async function loadAI() {

    try {

        statusText.textContent = "Loading COCO-SSD...";

        await tf.ready();

        model = await cocoSsd.load({
            base: "lite_mobilenet_v2"
        });

        statusText.textContent = "AI ready - Looking for objects";

        console.log("COCO-SSD loaded!");

        // Begin object recognition.
        detectObjects();

    } catch (error) {

        console.error("AI loading error:", error);

        statusText.textContent = "AI failed to load";

    }
}


// ====================================
// OBJECT DETECTION
// ====================================

async function detectObjects() {

    if (!running || !model) return;

    if (camera.readyState < 2) {
        setTimeout(detectObjects, 500);
        return;
    }

    try {

        const predictions = await model.detect(camera, 20);

        latestDetections = predictions.filter(item =>
            item.score >= CONFIDENCE_THRESHOLD
        );

        // Extract object names.
        const currentObjects = new Set(
            latestDetections.map(item => item.class)
        );

        // Find newly appearing objects.
        const newObjects = [...currentObjects].filter(
            name => !previousObjects.has(name)
        );

        if (newObjects.length > 0) {
            speakObjects(newObjects);
        }

        previousObjects = currentObjects;

        // Update status.
        if (latestDetections.length > 0) {

            statusText.textContent =
                "Detected: " +
                [...currentObjects].join(", ");

        } else {

            statusText.textContent =
                "AI ready - Looking for objects";

        }

    } catch (error) {

        console.error("Detection error:", error);

    }

    // Run detection again.
    if (running) {
        setTimeout(detectObjects, DETECTION_INTERVAL);
    }
}


// ====================================
// TEXT TO SPEECH
// ====================================

function speakObjects(objects) {

    if (!speechEnabled) return;

    if (!("speechSynthesis" in window)) {
        console.warn("Speech synthesis unavailable");
        return;
    }

    const now = Date.now();

    if (now - lastSpeechTime < SPEECH_COOLDOWN) {
        return;
    }

    // Make object names sound more natural.
    const formatted = objects.map(name => {

        return name.replace(/_/g, " ");

    });

    let sentence;

    if (formatted.length === 1) {

        sentence = "I see a " + formatted[0] + ".";

    } else {

        sentence =
            "I see " +
            formatted.slice(0, -1).join(", ") +
            " and " +
            formatted[formatted.length - 1] +
            ".";

    }

    const utterance = new SpeechSynthesisUtterance(sentence);

    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    speechSynthesis.speak(utterance);

    lastSpeechTime = now;

    console.log("AI says:", sentence);
}


// ====================================
// DRAW DETECTION BOXES
// ====================================

function drawDetections(ctx, sx, sy, side, width, height) {

    ctx.save();

    ctx.lineWidth = 4;
    ctx.font = "bold 23px Arial";

    for (const detection of latestDetections) {

        const [x, y, w, h] = detection.bbox;

        // Convert video coordinates to square crop coordinates.
        const drawX = ((x - sx) / side) * width;
        const drawY = ((y - sy) / side) * height;

        const drawW = (w / side) * width;
        const drawH = (h / side) * height;

        // Skip objects outside the crop.
        if (
            drawX + drawW < 0 ||
            drawY + drawH < 0 ||
            drawX > width ||
            drawY > height
        ) continue;

        ctx.strokeStyle = "#00ff55";

        ctx.strokeRect(
            drawX,
            drawY,
            drawW,
            drawH
        );

        const label =
            detection.class +
            " " +
            Math.round(detection.score * 100) +
            "%";

        const labelWidth = ctx.measureText(label).width + 12;

        ctx.fillStyle = "#00cc44";

        ctx.fillRect(
            drawX,
            Math.max(0, drawY - 29),
            labelWidth,
            29
        );

        ctx.fillStyle = "black";

        ctx.fillText(
            label,
            drawX + 6,
            Math.max(21, drawY - 8)
        );

    }

    ctx.restore();
}


// ====================================
// CAMERA FRAME PROCESSING
// ====================================

const temp = document.createElement("canvas");

temp.width = 960;
temp.height = 960;

const tempCtx = temp.getContext("2d", {
    willReadFrequently: true
});


function processFrame() {

    if (!running) return;

    const width = left.width;
    const height = left.height;

    const videoWidth = camera.videoWidth;
    const videoHeight = camera.videoHeight;

    if (!videoWidth || !videoHeight) {

        requestAnimationFrame(processFrame);
        return;

    }

    // Center crop to a square.
    const side = Math.min(videoWidth, videoHeight);

    const sx = (videoWidth - side) / 2;
    const sy = (videoHeight - side) / 2;

    tempCtx.drawImage(
        camera,
        sx, sy, side, side,
        0, 0, width, height
    );

    const frame = tempCtx.getImageData(
        0, 0, width, height
    );

    const pixels = frame.data;

    // Bright colored light detection.
    for (let i = 0; i < pixels.length; i += 4) {

        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);

        const brightness = (r + g + b) / 3;

        const saturation = max === 0
            ? 0
            : (max - min) / max;

        if (
            brightness >= BRIGHTNESS_THRESHOLD &&
            max >= 250 &&
            saturation >= MIN_SATURATION
        ) {

            pixels[i] = 255;

            pixels[i + 1] = Math.round(
                g * (1 - RED_STRENGTH)
            );

            pixels[i + 2] = Math.round(
                b * (1 - RED_STRENGTH)
            );

        }

    }

    // Draw processed camera image.
    ctxLeft.putImageData(frame, 0, 0);
    ctxRight.putImageData(frame, 0, 0);

    // Draw AI detection boxes.
    drawDetections(ctxLeft, sx, sy, side, width, height);
    drawDetections(ctxRight, sx, sy, side, width, height);

    requestAnimationFrame(processFrame);
}


// ====================================
// SPEECH CONTROLS
// ====================================

// Double-click to toggle speech.
document.getElementById("stage").addEventListener(
    "dblclick",
    () => {

        speechEnabled = !speechEnabled;

        if (!speechEnabled) {
            speechSynthesis.cancel();
        }

        statusText.textContent = speechEnabled
            ? "Speech enabled"
            : "Speech disabled";

    }
);


// Start on click.
document.getElementById("stage").addEventListener(
    "click",
    startCamera
);


// ====================================
// CLEANUP
// ====================================

window.addEventListener("pagehide", () => {

    running = false;

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }

});

</script>

</body>
</html>
