
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Dual Circle Camera</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    padding: 2vw;
}

.lens {
    width: min(47vw, 48vh);
    height: min(47vw, 48vh);
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: black;
    position: relative;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
}

@media (orientation: landscape) {
    .lens {
        width: min(47vw, 88vh);
        height: min(47vw, 88vh);
    }
}

#placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: white;
    background: black;
    font: 16px system-ui;
    text-align: center;
    z-index: 5;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 10;
    pointer-events: none;
}

#description {
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    max-width: 90%;
    text-align: center;
    font-size: 15px;
    min-height: 20px;
    line-height: 1.5;
}

#buttons {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

button {
    background: white;
    color: black;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
}

#status {
    color: #aaa;
    font-size: 12px;
    text-align: center;
}

</style>
</head>

<body>

<div id="stage">

    <div class="lens">
        <canvas id="left"></canvas>
    </div>

    <div class="lens">
        <canvas id="right"></canvas>
    </div>

    <div id="placeholder">
        TAP TO LOAD RENDERSCORCHBLADE
    </div>

</div>

<video id="camera" autoplay playsinline muted
       style="display:none"></video>

<div id="controls">

    <div id="description">
        AI description will appear here.
    </div>

    <div id="status">
        Camera not started
    </div>

    <div id="buttons">
        <button id="describe" disabled>
            Describe Now
        </button>

        <button id="speech">
            Mute Voice
        </button>
    </div>

</div>

<script type="module">

import { pipeline } from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";

const camera = document.getElementById("camera");
const placeholder = document.getElementById("placeholder");

const left = document.getElementById("left");
const right = document.getElementById("right");

const description = document.getElementById("description");
const status = document.getElementById("status");

const describeButton = document.getElementById("describe");
const speechButton = document.getElementById("speech");

const ctxLeft = left.getContext("2d", {
    willReadFrequently: true
});

const ctxRight = right.getContext("2d", {
    willReadFrequently: true
});

let stream = null;
let running = false;

let captioner = null;
let modelLoading = false;
let analyzing = false;
let muted = false;

let lastDescription = "";
let lastSpoken = "";
let lastAnalysis = 0;

const ANALYSIS_INTERVAL = 8000;

// Brightness highlighting settings
const BRIGHTNESS_THRESHOLD = 245;
const MIN_SATURATION = 0.08;
const RED_STRENGTH = 1;

// Reusable processing canvas
const temp = document.createElement("canvas");
temp.width = 960;
temp.height = 960;

const tempCtx = temp.getContext("2d", {
    willReadFrequently: true
});


// START CAMERA
async function startCamera() {

    if (stream) return;

    try {

        status.textContent = "Starting camera...";

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 3840
                },
                height: {
                    ideal: 2160
                },
                frameRate: {
                    ideal: 30
                }
            }
        });

        camera.srcObject = stream;

        await camera.play();

        placeholder.style.display = "none";

        left.width = right.width = 960;
        left.height = right.height = 960;

        running = true;

        describeButton.disabled = false;

        status.textContent = "Camera running. Loading AI...";

        processFrame();

        loadAI();

    } catch (error) {

        console.error(error);

        placeholder.textContent =
            "Camera access failed. Allow camera access and try again.";

        status.textContent = "Camera error";

        stream = null;

    }
}


// LOAD IMAGE RECOGNITION AI
async function loadAI() {

    if (captioner || modelLoading) return;

    modelLoading = true;

    status.textContent =
        "Downloading image recognition AI...";

    try {

        captioner = await pipeline(
            "image-to-text",
            "Xenova/vit-gpt2-image-captioning"
        );

        status.textContent =
            "AI ready. Looking at your surroundings.";

        // Start automatic recognition
        analyzeImage();

    } catch (error) {

        console.error("AI loading error:", error);

        status.textContent =
            "AI failed to load. Check your internet connection.";

    }

    modelLoading = false;
}


// CAMERA FRAME PROCESSING
function processFrame() {

    if (!running) return;

    const width = left.width;
    const height = left.height;

    const videoWidth = camera.videoWidth;
    const videoHeight = camera.videoHeight;

    if (!videoWidth || !videoHeight) {
        requestAnimationFrame(processFrame);
        return;
    }

    // Center crop to square
    const side = Math.min(videoWidth, videoHeight);

    const sx = (videoWidth - side) / 2;
    const sy = (videoHeight - side) / 2;

    tempCtx.drawImage(
        camera,
        sx, sy, side, side,
        0, 0, width, height
    );

    const frame = tempCtx.getImageData(
        0, 0, width, height
    );

    const pixels = frame.data;

    // Highlight bright colored lights in red
    for (let i = 0; i < pixels.length; i += 4) {

        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);

        const brightness = (r + g + b) / 3;

        const saturation = max === 0
            ? 0
            : (max - min) / max;

        if (
            brightness >= BRIGHTNESS_THRESHOLD &&
            max >= 250 &&
            saturation >= MIN_SATURATION
        ) {

            pixels[i] = 255;
            pixels[i + 1] = Math.round(
                g * (1 - RED_STRENGTH)
            );
            pixels[i + 2] = Math.round(
                b * (1 - RED_STRENGTH)
            );

        }

    }

    // Display in both circular cameras
    ctxLeft.putImageData(frame, 0, 0);
    ctxRight.putImageData(frame, 0, 0);

    requestAnimationFrame(processFrame);
}


// IMAGE RECOGNITION
async function analyzeImage() {

    if (!running || !captioner || analyzing) return;

    analyzing = true;

    status.textContent = "AI is analyzing the camera...";

    try {

        // Use the unprocessed camera image for recognition
        const width = 512;
        const height = 512;

        const videoWidth = camera.videoWidth;
        const videoHeight = camera.videoHeight;

        const side = Math.min(videoWidth, videoHeight);

        const sx = (videoWidth - side) / 2;
        const sy = (videoHeight - side) / 2;

        const recognitionCanvas =
            document.createElement("canvas");

        recognitionCanvas.width = width;
        recognitionCanvas.height = height;

        const recognitionCtx =
            recognitionCanvas.getContext("2d");

        recognitionCtx.drawImage(
            camera,
            sx, sy, side, side,
            0, 0, width, height
        );

        const image = recognitionCanvas.toDataURL(
            "image/jpeg",
            0.85
        );

        // Ask the AI to describe the image
        const result = await captioner(image);

        if (!running) return;

        let caption = "";

        if (Array.isArray(result) && result.length > 0) {
            caption = result[0].generated_text;
        }

        if (!caption) {
            caption = "I couldn't identify anything clearly.";
        }

        caption = caption.trim();

        lastDescription = caption;

        description.textContent = caption;

        status.textContent =
            "AI recognition complete. Next scan in 8 seconds.";

        // Speak only when the description changes
        if (
            !muted &&
            caption.toLowerCase() !== lastSpoken.toLowerCase()
        ) {

            speak(caption);

            lastSpoken = caption;

        }

    } catch (error) {

        console.error("Recognition error:", error);

        status.textContent =
            "Recognition failed. Trying again shortly.";

    }

    analyzing = false;

    lastAnalysis = Date.now();

}


// SPEECH
function speak(text) {

    if (muted || !("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    // Prefer an English voice
    const voices = window.speechSynthesis.getVoices();

    const englishVoice = voices.find(voice =>
        voice.lang.toLowerCase().startsWith("en")
    );

    if (englishVoice) {
        utterance.voice = englishVoice;
    }

    window.speechSynthesis.speak(utterance);

}


// AUTOMATIC RECOGNITION LOOP
setInterval(() => {

    if (!running || !captioner || analyzing) return;

    if (
        Date.now() - lastAnalysis >= ANALYSIS_INTERVAL
    ) {

        analyzeImage();

    }

}, 1000);


// BUTTONS
placeholder.addEventListener("click", startCamera);

describeButton.addEventListener("click", () => {

    if (!captioner) {

        status.textContent =
            "AI is still loading. Please wait.";

        return;

    }

    // Allow the same description to be spoken again
    lastSpoken = "";

    analyzeImage();

});

speechButton.addEventListener("click", () => {

    muted = !muted;

    if (muted) {

        window.speechSynthesis.cancel();

        speechButton.textContent = "Unmute Voice";

    } else {

        speechButton.textContent = "Mute Voice";

        if (lastDescription) {
            speak(lastDescription);
        }

    }

});


// STOP CAMERA WHEN LEAVING
window.addEventListener("pagehide", () => {

    running = false;

    window.speechSynthesis.cancel();

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

});

</script>

</body>
</html>
