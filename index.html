
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dual Circle Camera</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    padding: 2vw;
}

.lens {
    width: min(47vw, 48vh);
    height: min(47vw, 48vh);
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: black;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    image-rendering: auto;
}

@media (orientation: landscape) {
    .lens {
        width: min(47vw, 88vh);
        height: min(47vw, 88vh);
    }
}

#placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: white;
    background: black;
    font: 16px system-ui;
    text-align: center;
}
</style>
</head>

<body>

<div id="stage">

    <div class="lens">
        <video id="left" autoplay playsinline muted></video>
    </div>

    <div class="lens">
        <video id="right" autoplay playsinline muted></video>
    </div>

    <div id="placeholder">
        Tap anywhere to start camera
    </div>

</div>

<script>

const left = document.getElementById("left");
const right = document.getElementById("right");
const placeholder = document.getElementById("placeholder");

let stream = null;

async function startCamera() {

    if (stream) return;

    try {

        stream = await navigator.mediaDevices.getUserMedia({

            audio: false,

            video: {
                facingMode: {
                    ideal: "environment"
                },

                width: {
                    ideal: 3840
                },

                height: {
                    ideal: 2160
                },

                frameRate: {
                    ideal: 30
                },

                aspectRatio: {
                    ideal: 1
                }
            }

        });

        left.srcObject = stream;
        right.srcObject = stream;

        await Promise.all([
            left.play(),
            right.play()
        ]);

        placeholder.style.display = "none";

        // Display the actual camera resolution in the console.
        const settings = stream.getVideoTracks()[0].getSettings();

        console.log("Camera resolution:", settings.width, "x", settings.height);
        console.log("Frame rate:", settings.frameRate);

    } catch (error) {

        console.error(error);

        placeholder.textContent =
            "Camera access failed. Allow camera access and tap again.";

        stream = null;

    }
}

document.getElementById("stage").addEventListener(
    "click",
    startCamera
);

window.addEventListener("pagehide", () => {

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }

});

</script>

</body>
</html>
