function random(a){return a[Math.floor(Math.random()*a.length)]}

function bot(name){return bots.find(b=>b.name===name)||random(bots)}

function systemMessage(text){

}

function scrollChat(){

function addMessage(name,text,color){

button.dataset.count=count;
button.textContent=emoji+" "+count;

tools.appendChild(button);
});

messages.appendChild(el);
scrollChat();
}

// Start one of 100 conversations
function startConversation(){
const scenario=conversations[conversationIndex%conversations.length];
conversationIndex++;

systemMessage("A new conversation has started.");

const participants=bots.map(b=>b.name);

const names=participants.sort(()=>Math.random()-.5).slice(0,4);

const lines=[
[names[0],scenario[0]],
[names[1],scenario[1]],
[names[2],scenario[2]],
[names[3],scenario[3]]
];

let delay=0;
lines.forEach((line)=>{
delay+=900+Math.random()*1200;
setTimeout(()=>{
if(running||!document.hidden)say(line[0],line[1]);
},delay);
});

lastConversation=Date.now();
}

// Camera detection
function drawDetections(predictions){
ctx.clearRect(0,0,canvas.width,canvas.height);

for(const p of predictions){
if(p.score<.5)continue;
const [x,y,w,h]=p.bbox;

ctx.strokeStyle="#00ff88";
ctx.lineWidth=3;
ctx.strokeRect(x,y,w,h);

const label=p.class+" "+Math.round(p.score*100)+"%";
ctx.font="bold 16px monospace";
ctx.fillStyle="#00ff88";
ctx.fillRect(x,Math.max(0,y-23),ctx.measureText(label).width+10,23);
ctx.fillStyle="#000";
ctx.fillText(label,x+5,Math.max(17,y-6));
}
}

function processObjects(predictions){
const found=[...new Set(predictions.filter(p=>p.score>.65).map(p=>p.class))];

currentObjects=found;
detected.textContent="Objects: "+found.length;

const added=found.filter(o=>!previousObjects.includes(o));
previousObjects=[...found];

if(!added.length||Date.now()-lastObjectMessage<5000)return;

lastObjectMessage=Date.now();
const obj=random(added);

const lines=[
"Wait, I think I see a "+obj+".",
"New object detected: "+obj+"!",
"Anyone else noticing that "+obj+"?",
"There's a "+obj+" in the camera view.",
"Interesting, a "+obj+" just appeared.",
"Look at that "+obj+"!"
];

say(random(["Pixel","Nova","Byte","Echo"]),random(lines));

if(Math.random()<.8){
setTimeout(()=>{
const replies=[
"HAS GIFTED 20 SUBS",
"HAS GIFTED 5 SUBS",
"HAS GIFTED SUBS",
];
say(random(["Glitch","Toast","Mochi","Circuit"]),random(replies));
},1300);
}
}

"What's something interesting to talk about?",

"What should we do next?",
"What is everyone thinking about?",
"Does anyone have an interesting fact?",

"What would you do if you were human for a day?",

];

const question=random(questions);
addMessage("You",question,"#fff");

setTimeout(()=>say(random(bots).name,random([
"That's a good question!",
"I've been thinking about that.",
"I have an opinion on this.",
"Interesting question!",
"Let me think about that.",
"Anyone else want to answer?"
])),700);

// User-created poll
function startPoll(){
if(pollActive){
systemMessage("A poll is already running.");
return;
}

pollActive=true;

const questions=[
["Where is verity from?","Minecraft","Backrooms"]
];

const q=random(questions);

const el=document.createElement("div");
el.className="poll";

const title=document.createElement("b");
title.textContent="📊 "+q[0];
el.appendChild(title);

const results=[0,0];
let voted=false;

q.slice(1).forEach((option,i)=>{
const button=document.createElement("button");
button.className="pollOption";
button.textContent=option;

button.onclick=()=>{
if(voted)return;
voted=true;
results[i]++;

const result=el.querySelector(".pollResult");
result.textContent="Your vote: "+option;
el.querySelectorAll("button").forEach(b=>b.disabled=true);
};

el.appendChild(button);
});

const result=document.createElement("div");
result.className="pollResult";
result.textContent="Choose an option to vote.";
el.appendChild(result);

messages.appendChild(el);
scrollChat();

setTimeout(()=>{
if(!el.isConnected)return;

results[Math.floor(Math.random()*2)]+=2;
result.textContent="Poll finished! "+q[1]+": "+results[0]+" votes · "+q[2]+": "+results[1]+" votes";
pollActive=false;

say(random(bots).name,"The poll results are in!");
},12000);
}

// Respond to user messages
function respondToUser(text){
const lower=text.toLowerCase();

let response;

if(lower.includes("?")){
response=random([
"That's an interesting question. What do the others think?",
"I think I have an answer, but I'm curious what everyone else thinks.",
"Good question! I've been wondering about that too.",
"Let me think about it for a moment.",
"Interesting! I have a slightly different opinion.",
"Does anyone else have an idea?",
"That's actually more complicated than it sounds."
]);
}else if(lower.includes("hello")||lower.includes("hi ")){
response=random(["Hey!","Hello! Welcome back.","Hi there!","Hey, nice to see you in chat!"]);
}else if(lower.includes("camera")){
response="The camera currently detects "+(currentObjects.length?currentObjects.join(", "):"nothing identifiable")+".";
}else if(lower.includes("joke")){
response=random(["Why did the computer go to the doctor? It had a virus.","Why was the math book sad? Too many problems.","I would tell you a UDP joke, but you might not get it."]);
}else if(lower.includes("pixel")||lower.includes("byte")||lower.includes("glitch")||lower.includes("nova")||lower.includes("toast")||lower.includes("echo")||lower.includes("mochi")||lower.includes("circuit")){
response="Did someone mention me? I'm listening!";
}else{
response=random([
"That's an interesting point.",
"I agree with part of that.",
"I hadn't thought of it that way.",
"What does everyone else think?",
"Interesting. Tell us more!",
"That's actually pretty funny.",
"I have a different perspective on that.",
"Fair enough!",
"Can you explain that a little more?",
"That reminds me of something."
]);
}

const selected=random(bots);

setTimeout(()=>say(selected.name,response),800+Math.random()*1300);

if(Math.random()<.55){
setTimeout(()=>{
say(random(bots).name,random([
"I agree with that!",
"Interesting response.",
"I have something to add.",
"Wait, I disagree.",
"That's a good point.",
"LOL"
]));
},2500);
}
}

// User commands
function sendMessage(){
const text=chatInput.value.trim();
if(!text)return;

chatInput.value="";

if(text==="/help"){
systemMessage("Commands: /help, /poll, /ask, /clear");
return;
}

if(text==="/poll"){
startPoll();
return;
}

if(text==="/ask"){
askChat();
return;
}

if(text==="/clear"){
messages.innerHTML="";
systemMessage("Chat cleared.");
return;
}

addMessage("You",text,"#fff");

const mention=text.match(/@(\w+)/);
if(mention){
const mentioned=bots.find(b=>b.name.toLowerCase()===mention[1].toLowerCase());
if(mentioned){
setTimeout(()=>say(mentioned.name,"You called? I'm here!"),700);
}
}

respondToUser(text);
}

document.getElementById("send").onclick=sendMessage;
chatInput.addEventListener("keydown",e=>{
if(e.key==="Enter")sendMessage();
});

function updateViewers(){
document.getElementById("viewers").textContent=
"● "+(4+Math.floor(Math.random()*15))+" viewers";
}

// Main loop
async function detectLoop(){
if(!running)return;

if(!busy&&video.readyState>=2){
busy=true;
try{
const predictions=await model.detect(video);
drawDetections(predictions);
processObjects(predictions);
}catch(e){console.error(e)}
busy=false;
}

if(running)setTimeout(detectLoop,180);
}

// Start camera
async function startCamera(){
const button=document.getElementById("start");
button.disabled=true;
button.textContent="LOADING AI...";

try{
model=await cocoSsd.load();

stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"},
audio:false
});

video.srcObject=stream;
await new Promise(resolve=>video.onloadedmetadata=resolve);
await video.play();

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

running=true;
button.style.display="none";
status.textContent="LIVE";

systemMessage("Camera connected.");
systemMessage("8 AI viewers joined the stream.");

say("Pixel","Hello everyone! We're live!");
setTimeout(()=>say("Byte","Object recognition system online."),1000);
setTimeout(()=>say("GLITCH HAS GIFTED A SUB",""),2000);
setTimeout(()=>startConversation(),4000);

detectLoop();

setInterval(()=>{
if(running)updateViewers();
},10000);

setInterval(()=>{
if(!running)return;
if(Math.random()<.75)startConversation();
},22000);

setInterval(()=>{
if(!running)return;
if(Date.now()-lastObjectMessage>12000&&currentObjects.length){
const obj=random(currentObjects);
say(random(bots).name,"FUCK YOU I HATE YOU "+obj+".");
}
},17000);

}catch(error){
status.textContent="ERROR";
button.disabled=false;
button.textContent="RETRY CAMERA";
systemMessage("Camera error: "+error.message);
console.error(error);
}
}

document.getElementById("start").onclick=startCamera;

// Initial messages
systemMessage("Welcome to AI Vision Chat.");
say("Toast","Is anybody here?");
say("Pixel","I'm here!");
say("Glitch","Unfortunately, so am I.");
say("Byte","Let's start a conversation.");
say("Mochi","Hi everyone!");
</script>
</body>
</html>
